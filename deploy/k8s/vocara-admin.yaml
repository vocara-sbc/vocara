# ============================================================
# Vocara Call Center System - vocara-admin Admin API
# ============================================================

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: vocara-admin
  namespace: vocara
  labels:
    app: vocara-admin
    app.kubernetes.io/name: vocara-admin
    app.kubernetes.io/part-of: vocara
spec:
  # NodePort: FS nodes using hostNetwork cannot resolve cluster Service names;
  # this port provides direct access to admin (target for xml_curl dynamic directory/dialplan callbacks)
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
      nodePort: 30080
  selector:
    app: vocara-admin

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vocara-admin
  namespace: vocara
  labels:
    app: vocara-admin
    app.kubernetes.io/name: vocara-admin
    app.kubernetes.io/part-of: vocara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vocara-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vocara-admin
      annotations:
        # Automatically restart Pods when the configuration changes
        config-hash: "PLACEHOLDER"
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      # Optional initialization that waits for dependencies to become ready (enable as needed)
      # initContainers:
      #   - name: wait-deps
      #     image: busybox:1.36
      #     command:
      #       - sh
      #       - -c
      #       - |
      #         echo "Waiting for MySQL to become ready..."
      #         until nc -z vocara-mysql 3306; do sleep 2; done
      #         echo "MySQL is ready"
      #         echo "Waiting for Redis to become ready..."
      #         until nc -z vocara-redis 6379; do sleep 2; done
      #         echo "Redis is ready"
      #         echo "Waiting for NATS to become ready..."
      #         until nc -z vocara-nats 4222; do sleep 2; done
      #         echo "NATS is ready"

      containers:
        - name: vocara-admin
          # Image registry placeholder; replace with the actual registry address
          image: registry.example.com/vocara/vocara-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Time zone
            - name: TZ
              value: "Asia/Shanghai"

            # Configuration file path: points to config.yaml mounted from the ConfigMap below
            - name: CONFIG_PATH
              value: "/app/config.yaml"

            # Service run mode
            - name: VOCARA_SERVER_MODE
              value: "release"

            # Application secret key: used for JWT signing and X-Internal-Token between internal services (same value across all five services; use a Secret when possible)
            - name: VOCARA_APP_SECRET_KEY
              value: "change-me-to-a-strong-secret-key"  # TODO: Replace with a strong secret key

            # Database password (overrides mysql.password in the configuration file)
            - name: VOCARA_MYSQL_PASSWORD
              value: "vocara123"  # TODO: Replace with the actual password; use a Secret when possible
            # Example using a Secret:
            # - name: VOCARA_MYSQL_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: vocara-secrets
            #       key: db-password

            # Redis password
            - name: VOCARA_REDIS_PASSWORD
              value: ""  # Leave empty when no password is configured

            # NATS password
            - name: VOCARA_NATS_PASSWORD
              value: ""

            # FreeSWITCH node addresses (hostNetwork has no cluster Service; configure the actual node IPs)
            - name: VOCARA_FS_DIALPLAN_SBC_PEER
              value: "192.168.100.10:5061"  # FS-SBC node internal-to-agent profile endpoint
            - name: VOCARA_FS_DIALPLAN_AGENT_EXTERNAL
              value: "192.168.100.11:5080"  # FS-Agent node external profile endpoint
            - name: VOCARA_FS_DIALPLAN_GATEWAY
              value: "carrier"

          # Resource requests and limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Readiness probe: checks whether the service is ready to accept traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Liveness probe: checks whether the service is still running
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Graceful shutdown hook
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 10"  # Wait for connection draining to complete

          volumeMounts:
            # Mount the configuration file
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            
      volumes:
        - name: config
          configMap:
            name: vocara-admin-config

