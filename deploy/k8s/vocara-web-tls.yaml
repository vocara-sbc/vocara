# ============================================================
# Vocara 呼叫中心系统 - web 前端 TLS 证书 Secret
#
# 自签证书（仅 dev / 内网测试用；生产请替换为正式 CA 证书）。
# nginx 的 443 ssl 从本 Secret 挂载目录 /etc/nginx/certs/ 读取
# tls.crt / tls.key（见 vocara-web.yaml 的 tls volume）。
#
# SAN 内容：DNS:localhost, IP:127.0.0.1, IP:192.168.100.10, IP:192.168.100.11。
# 若座席浏览器访问用的是其他节点 IP，需重新生成证书并同步替换下方
# data.tls.crt / data.tls.key（base64 单行）：
#   openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
#     -keyout tls.key -out tls.crt -days 365 -subj "/CN=vocara-web" \
#     -addext "subjectAltName=DNS:localhost,IP:<访问IP1>,IP:<访问IP2>"
#   openssl base64 -A -in tls.crt   # 去掉换行后填入 data.tls.crt
#   openssl base64 -A -in tls.key   # 同理填入 data.tls.key
# ============================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: vocara-web-tls
  namespace: vocara
  labels:
    app: vocara-web
    app.kubernetes.io/name: vocara-web
    app.kubernetes.io/part-of: vocara
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 