# ============================================================
# Vocara Call Center System - TLS Certificate Secret for the Web Frontend
#
# Self-signed certificate (for dev / internal network testing only; use a certificate issued by a trusted CA in production).
# For 443 ssl, nginx reads tls.crt / tls.key from /etc/nginx/certs/, where this Secret is mounted
# (see the tls volume in vocara-web.yaml).
#
# SAN entries: DNS:localhost, IP:127.0.0.1, IP:192.168.100.10, IP:192.168.100.11.
# If agents access the service through other node IPs, regenerate the certificate and update
# data.tls.crt / data.tls.key below (single-line base64):
#   openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
#     -keyout tls.key -out tls.crt -days 365 -subj "/CN=vocara-web" \
#     -addext "subjectAltName=DNS:localhost,IP:<accessIP1>,IP:<accessIP2>"
#   openssl base64 -A -in tls.crt   # Remove line breaks and place the result in data.tls.crt
#   openssl base64 -A -in tls.key   # Do the same for data.tls.key
# ============================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: vocara-web-tls
  namespace: vocara
  labels:
    app: vocara-web
    app.kubernetes.io/name: vocara-web
    app.kubernetes.io/part-of: vocara
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
