# FreeSWITCH SBC deployment (configuration mounted via hostPath)
# The SBC handles external line access, customer-side media processing, outbound calls to customers, and recording
# FreeSWITCH uses hostNetwork because RTP requires a large port range.
#
# Usage:
#   1. Prepare the hostPath directories on the target node:
#      mkdir -p /data/vocara/freeswitch/fs-sbc/conf
#               /data/vocara/freeswitch/fs-sbc/recordings
#               /data/vocara/freeswitch/fs-sbc/log
#               /data/vocara/freeswitch/fs-sbc/certs
#   2. Copy the fs-sbc conf configuration from the freeswitch/ directory in the core repository to the node:
#      cp -r fs-sbc/conf/* /data/vocara/freeswitch/fs-sbc/conf/
#   3. Replace the image tag with your private registry (registry.example.com/vocara/ is a placeholder).
#   4. kubectl apply -f deploy/k8s/freeswitch-sbc.yaml
#
# The default FreeSWITCH CMD daemonizes the process and causes the container to exit.
# Run it in the foreground with -nf; -nonat disables Auto-NAT (direct internal networking with hostNetwork).

kind: Deployment
apiVersion: apps/v1
metadata:
  name: vocara-fs-sbc
  namespace: vocara
  labels:
    app: vocara-fs-sbc
    role: sbc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vocara-fs-sbc
  template:
    metadata:
      labels:
        app: vocara-fs-sbc
        role: sbc
    spec:
      enableServiceLinks: false
      volumes:
        - name: fs-conf
          hostPath:
            path: /data/vocara/freeswitch/fs-sbc/conf
            type: DirectoryOrCreate
        - name: fs-records
          hostPath:
            path: /data/vocara/freeswitch/fs-sbc/recordings
            type: DirectoryOrCreate
        - name: fs-log
          hostPath:
            path: /data/vocara/freeswitch/fs-sbc/log
            type: DirectoryOrCreate
        - name: fs-certs
          hostPath:
            path: /data/vocara/freeswitch/fs-sbc/certs
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
      containers:
        - name: freeswitch
          image: registry.example.com/vocara/freeswitch:1.10.10
          command:
            - /usr/local/freeswitch/bin/freeswitch
          args:
            - -nf
            - -nonat
          env:
            # SBC node SIP domain (softphone registration address); points to the actual node IP in the integration environment
            - name: VOCARA_FS_SBC_DOMAIN
              value: "192.168.100.10"
            # Admin service address (xml_curl dynamic directory/dialplan callback target);
            # hostNetwork cannot resolve cluster Service names, so connect directly through the admin NodePort
            - name: VOCARA_ADMIN_ADDR
              value: "192.168.100.10:30080"
            # xml_curl callback authentication token; must match the admin VOCARA_APP_SECRET_KEY
            - name: VOCARA_FS_ADMIN_TOKEN
              value: "change-me-to-a-strong-secret-key"
          volumeMounts:
            - name: fs-conf
              mountPath: /usr/local/freeswitch/conf
            - name: fs-records
              mountPath: /usr/local/freeswitch/recordings
            - name: fs-log
              mountPath: /usr/local/freeswitch/log
            - name: fs-certs
              mountPath: /usr/local/freeswitch/certs
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          securityContext:
            # SCHED_FIFO real-time scheduling requires privileges
            privileged: true
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: master1
