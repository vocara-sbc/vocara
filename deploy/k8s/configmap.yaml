# ============================================================
# Vocara Call Center System - Runtime Configuration ConfigMap
# Each microservice has its own ConfigMap, with the config.yaml key mounted as the configuration file in the container.
# Sensitive items (secret keys and passwords) are left blank here and injected by the Deployment as
# environment variables with the VOCARA_ prefix. pkg/config uses viper AutomaticEnv to recognize the prefix and override matching keys.
# For example, VOCARA_MYSQL_PASSWORD overrides mysql.password.
# The dual FreeSWITCH nodes run with hostNetwork and have no cluster Service; their node addresses
# are also injected via environment variables (VOCARA_ESL_HOST, VOCARA_FS_DIALPLAN_*).
# FreeSWITCH reads environment variables through env-set preprocessor directives in conf/vars.xml:
# VOCARA_FS_AGENT_DOMAIN / VOCARA_FS_SBC_DOMAIN (SIP domains for the two nodes).
# When not injected, they fall back to the default in vars.xml (127.0.0.1).
#
# redis.db is consistently set to 0: cross-service shared keys such as license and install_id are distributed through Redis.
# All services must read from the same db; otherwise, reading the wrong db causes a fallback to local files and authorization failure.
# ============================================================

---
# vocara-admin admin API configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vocara-admin-config
  namespace: vocara
  labels:
    app: vocara-admin
    app.kubernetes.io/name: vocara-admin
    app.kubernetes.io/part-of: vocara
data:
  config.yaml: |
    app:
      name: vocara-admin
      version: 1.0.0
      env: prod
      secret_key: ""            # VOCARA_APP_SECRET_KEY: JWT signing and internal inter-service tokens
      timezone: Asia/Shanghai

    server:
      host: 0.0.0.0
      port: 8080
      mode: release             # debug / release; can be overridden by VOCARA_SERVER_MODE
      read_timeout: 30
      write_timeout: 30
      idle_timeout: 60
      max_request_body: 10485760
      shutdown_timeout: 30

    mysql:
      host: vocara-mysql
      port: 3306
      user: root
      password: ""              # VOCARA_MYSQL_PASSWORD
      database: vocara
      charset: utf8mb4
      collation: utf8mb4_unicode_ci
      parse_time: true
      loc: Local
      max_idle_conns: 10
      max_open_conns: 100
      conn_max_lifetime: 60
      conn_max_idle_time: 10
      auto_migrate: true
      slow_threshold: 1000
      log_level: warn

    redis:
      mode: single
      addrs: vocara-redis:6379
      username: ""
      password: ""              # VOCARA_REDIS_PASSWORD
      db: 0
      master_name: ""
      pool_size: 50
      min_idle_conns: 10
      max_retries: 3
      dial_timeout: 5000
      read_timeout: 3000
      write_timeout: 3000
      pool_timeout: 4000
      idle_timeout: 300
      idle_check_freq: 60

    nats:
      urls: nats://vocara-nats:4222
      user: ""
      password: ""              # VOCARA_NATS_PASSWORD
      token: ""
      reconnect_wait: 2
      max_reconnect: -1
      reconnect_buf: 8388608
      timeout: 5
      flush_timeout: 5
      cluster_id: vocara
      client_id: admin-service

    log:
      level: info
      format: json
      output: stdout            # stdout / file / both
      file_path: ./logs/admin.log
      max_size: 100
      max_age: 30
      max_backups: 10
      compress: true
      caller: true
      caller_skip: 1

    license:
      file: ./license/vocara.lic
      check_interval: 3600
      fail_open: false

    # FreeSWITCH dialplan is delivered dynamically: rule content is pulled in real time via mod_xml_curl.
    # This section only configures environment-specific node addresses and the outbound gateway name
    fs_dialplan:
      sbc_peer: ""              # VOCARA_FS_DIALPLAN_SBC_PEER: host:port
      agent_external: ""        # VOCARA_FS_DIALPLAN_AGENT_EXTERNAL: host:port
      gateway: carrier          # VOCARA_FS_DIALPLAN_GATEWAY: carrier gateway name

