# Vocara 管理后台配置文件

app:
  name: vocara-admin
  version: 1.0.0
  env: dev
  secret_key: vocara-dev-shared-secret-2026
  timezone: Asia/Shanghai

server:
  host: 0.0.0.0
  port: 8080
  mode: debug
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 60
  max_request_body: 10485760
  shutdown_timeout: 30

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "vocara123"
  database: vocara
  charset: utf8mb4
  collation: utf8mb4_unicode_ci
  parse_time: true
  loc: Local
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 60
  conn_max_idle_time: 10
  auto_migrate: true
  slow_threshold: 1000
  log_level: warn

redis:
  mode: single
  addrs: 127.0.0.1:6379
  username: ""
  password: ""
  db: 0
  master_name: ""
  pool_size: 50
  min_idle_conns: 10
  max_retries: 3
  dial_timeout: 5000
  read_timeout: 3000
  write_timeout: 3000
  pool_timeout: 4000
  idle_timeout: 300
  idle_check_freq: 60

nats:
  urls: nats://127.0.0.1:4222
  user: ""
  password: ""
  token: ""
  reconnect_wait: 2
  max_reconnect: -1
  reconnect_buf: 8388608
  timeout: 5
  flush_timeout: 5
  cluster_id: vocara
  client_id: admin-service

log:
  level: info
  format: json
  output: "file"   # stdout | file | both——仅写文件，避免与 run.cmd stdout 重定向产生重复日志
  file_path: ./logs/admin.log
  max_size: 100
  max_age: 30
  max_backups: 10
  compress: true
  caller: true
  caller_skip: 1

# License 授权：离线 vocara.lic，进程内置公钥本地验签
license:
  file: ./license/vocara.lic   # License 文件路径
  check_interval: 3600         # 运行期复校间隔（秒）
  fail_open: false             # 验签或指纹异常时放行业务，仅排障临时使用

# FreeSWITCH 拨号计划动态下发：规则由 admin 经 mod_xml_curl 实时下发，
# 此处仅配置环境相关的节点地址与出局网关名
fs_dialplan:
  sbc_peer: 127.0.0.1:5061   # fs-agent 转发出局号码/未注册分机到 fs-sbc 的 to-sbc 入口
  agent_external: 127.0.0.1:5080  # fs-sbc 转发来话到 fs-agent 的 external 入口
  gateway: carrier             # fs-sbc 外呼出局的运营商网关名
